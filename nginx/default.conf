# Single-page static app. Caddy terminates TLS and adds compression in front;
# nginx just serves the file with sensible headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 건물 공유 API → node backend (private `internal` net). Docker 임베디드 DNS를
    # 런타임에 조회하도록 resolver + 변수를 써서, backend 컨테이너가 재시작해
    # IP가 바뀌어도 nginx 재시작 없이 따라간다. `rewrite`로 /api 접두어를 떼고
    # 넘긴다(변수 proxy_pass는 자동 URI 치환을 하지 않으므로 명시적으로 처리).
    location /api/ {
        # 건물 이관(import) + 사진 업로드(원본+썸네일 ~11MB) 통과. 백엔드 상한과 맞춤.
        client_max_body_size 12m;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $arcam_api backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$arcam_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 다중 사진 zip 다운로드(스트리밍)가 15s를 넘길 수 있어 넉넉히. 읽기 사이 최대 대기이므로
        # 짧은 건물 폴링에는 영향 없다.
        proxy_read_timeout 120s;
    }

    # index.html is the whole app — always revalidate so a redeploy shows up
    # immediately (no stale cached shell). `index` internally rewrites `/` to
    # /index.html, so this block covers both `/` and `/index.html`.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Service worker: never let the HTTP cache pin an old copy, or clients get
    # stuck on a stale worker. `default_type` avoids octet-stream on odd setups.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Web app manifest — `.webmanifest` isn't in nginx's default mime.types, so
    # set the correct type here (per-location default_type does NOT clobber the
    # global types map). Revalidate so manifest edits show up promptly.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # PWA icons: filenames aren't content-hashed, so don't let the HTTP cache pin
    # an old icon. `no-cache` = store but always revalidate via ETag, so a replaced
    # icon (or a re-minted WebAPK) picks up new bytes immediately instead of within
    # days. Cache-busting `?v=N` on the manifest/HTML refs handles already-pinned
    # copies from before this change.
    location /icons/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
