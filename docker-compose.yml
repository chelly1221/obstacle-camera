# 토지이용 AR — static site (nginx) + 건물 공유 API (node).
#
#   docker compose up -d
#
# The `app` container joins the external `web` network under the alias
# `arcam-app`; the shared Caddy stack (/srv/proxy) reverse-proxies
# https://arcam.3chan.kr → arcam-app:80 and handles TLS automatically.
#
# nginx proxies `/api/*` to the `backend` (node) service over a private
# `internal` network, so the API is reachable ONLY through nginx — never
# exposed directly to Caddy or the internet. Shared 건물/그룹 persist to
# ./data/store.json (bind-mounted, survives restarts & redeploys).
#
# First-time setup on a fresh host (already done on this VM):
#   docker network create web

services:
  app:
    image: nginx:alpine
    container_name: arcam_app
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      web:
        aliases:
          - arcam-app
      internal: {}

  backend:
    image: node:22-alpine
    container_name: arcam_api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - PORT=8080
      - DATA_FILE=/data/store.json
      # 쓰기 잠금이 필요하면 아래를 채우고 index.html의 API_KEY도 같은 값으로:
      # - WRITE_KEY=some-shared-secret
    volumes:
      - ./backend:/app:ro
      - ./data:/data
    networks:
      internal: {}

networks:
  web:
    external: true
  internal:
    driver: bridge
