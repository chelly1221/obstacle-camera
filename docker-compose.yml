# 토지이용 AR — static site served by nginx behind the shared Caddy proxy.
#
#   docker compose up -d
#
# The app container joins the external `web` network under the alias
# `arcam-app`; the shared Caddy stack (/srv/proxy) reverse-proxies
# https://arcam.3chan.kr → arcam-app:80 and handles TLS automatically.
#
# First-time setup on a fresh host (already done on this VM):
#   docker network create web

services:
  app:
    image: nginx:alpine
    container_name: arcam_app
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      web:
        aliases:
          - arcam-app

networks:
  web:
    external: true
